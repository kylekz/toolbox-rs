[package]
name = "gpui_automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "JSONL automation for gpui apps: the in-app driver, named targets, background windows and screenshots"

[lib]
doctest = false

# The driver itself. Off, the crate is only the no-op stand-ins views call unconditionally, so an
# app's shipped build carries none of it; an app's `automation` feature turns this on.
[features]
enabled = [
    "dep:core-graphics",
    "dep:futures",
    "dep:log",
    "dep:objc2",
    "dep:png",
    "dep:raw-window-handle",
    "dep:serde",
    "dep:serde_json",
    "dep:windows-sys",
    "dep:x11rb",
]

[dependencies]
anyhow.workspace = true
futures = { workspace = true, optional = true }
gpui.workspace = true
gpui_automation_protocol.workspace = true
log = { workspace = true, optional = true }
png = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Window screenshots (`capture_macos`) and background windows (`background`) on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }

# Window screenshots through X11 (`capture_x11`).
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
tempfile.workspace = true
