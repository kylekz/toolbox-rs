# The workflows themselves checked (actionlint, zizmor) on every push to main and every pull
# request, apart from CI so that it runs when CI skips a docs-only change.
#
# Security: the token is read-only, the job has no secret, the checkout keeps no credentials,
# every action is pinned to a commit, and nothing runs on pull_request_target.

name: Workflows

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint has no action of its own: its release archive, checked against the sha256 its
      # release publishes (actionlint_1.7.12_checksums.txt), so nothing unpinned runs here.
      - name: Download actionlint 1.7.12
        env:
          URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          advanced-security: false
          version: 1.31.1
