# script/check on GitHub's runners for every push to main and every pull request: the full check
# on Linux (the harness scenarios on the runner's own Xvfb display, drawn by a software Vulkan
# driver), --fast on Windows and macOS, whose hosted runners have no GPU to draw the harness
# with. The harness scenarios run on the owner's Mac and PC before every commit. A change to docs
# and Markdown alone builds nothing; workflows.yml checks the workflows on every change.
#
# Security: the token is read-only in every job, no job has a secret, checkouts keep no
# credentials, every action is pinned to a commit, and nothing runs on pull_request_target.
# Caches are saved from main alone.
#
# The cache holds the dependencies' build outputs, keyed by `script/ci-cache key` (the
# dependencies, the manifests without the workspace's version, the toolchain) and trimmed by
# `script/ci-cache trim` before it is saved.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux (script/check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gpui's system libraries, Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-x11-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            xvfb mesa-vulkan-drivers libvulkan1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Cache key
        id: key
        run: echo "hash=$(bash script/ci-cache key)" >> "$GITHUB_OUTPUT"
      - name: Restore main's cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-deps-${{ steps.key.outputs.hash }}
          restore-keys: linux-deps-
      - name: script/check
        run: bash script/check
      - name: The harness scenarios' screenshots and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-harness-linux
          path: target/e2e-harness
          retention-days: 7
          if-no-files-found: ignore
      - name: Trim the cache (main, once per set of dependencies)
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash script/ci-cache trim
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-deps-${{ steps.key.outputs.hash }}

  windows:
    name: Windows (script/check --fast)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # rust-lld, the toolchain's own linker, links the test binaries faster than link.exe.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustc --version
      - name: Cache key
        id: key
        shell: bash
        run: echo "hash=$(bash script/ci-cache key)" >> "$GITHUB_OUTPUT"
      - name: Restore main's cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-deps-${{ steps.key.outputs.hash }}
          restore-keys: windows-deps-
      # The runner's own temp dir, whose name is long: the default one is spelled with an 8.3
      # short name (C:\Users\RUNNER~1\…), which the file system reports long.
      - name: script/check --fast
        shell: bash
        run: |
          export TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP"
          bash script/check --fast
      - name: Trim the cache (main, once per set of dependencies)
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: bash script/ci-cache trim
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-deps-${{ steps.key.outputs.hash }}

  macos:
    name: macOS (script/check --fast)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: Cache key
        id: key
        run: echo "hash=$(bash script/ci-cache key)" >> "$GITHUB_OUTPUT"
      - name: Restore main's cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-deps-${{ steps.key.outputs.hash }}
          restore-keys: macos-deps-
      - name: script/check --fast
        run: bash script/check --fast
      - name: Trim the cache (main, once per set of dependencies)
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        run: bash script/ci-cache trim
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-deps-${{ steps.key.outputs.hash }}
